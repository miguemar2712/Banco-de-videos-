<!doctype html>
<html lang="es" data-zona="pantalla" data-composition-variables='[
  {"id": "numero", "type": "string", "label": "Número", "default": "01"},
  {"id": "titulo", "type": "string", "label": "Título a mano", "default": "mis clips"},
  {"id": "tag", "type": "string", "label": "Etiqueta", "default": "sin cortar ni nada"},
  {"id": "imagen", "type": "string", "label": "Imagen/captura (ruta, opcional)", "default": ""},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "hoja"},
  {"id": "papel", "type": "color", "label": "Fondo", "default": "#F5E6DF"},
  {"id": "tinta", "type": "color", "label": "Color texto", "default": "#5A2630"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "pantalla"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  :root { --papel: #F5E6DF; --tinta: #5A2630; }
  #cr06-cab { position: absolute; left: 70px; top: 200px; display: flex; align-items: center; gap: 26px; }
  #cr06-num { font: 900 170px/1 var(--sans); color: var(--tinta); letter-spacing: -6px; }
  #cr06-titulo { font: 700 74px var(--mano); color: var(--tinta); }
  #cr06-tag { display: inline-block; background: var(--tinta); color: #fff; font: 700 32px var(--sans); padding: 6px 20px; border-radius: 999px; margin-top: 4px; }
  #cr06-marco { position: absolute; left: 70px; right: 70px; top: 470px; height: 560px; border-radius: 30px; border: 10px solid #fff; overflow: hidden; box-shadow: 0 30px 60px rgba(60,20,30,.22);
    background: linear-gradient(135deg, color-mix(in srgb, var(--tinta) 12%, #fff), color-mix(in srgb, var(--tinta) 28%, #fff)); }
  #cr06-marco img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #cr06-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 40px var(--sans); color: color-mix(in srgb, var(--tinta) 55%, #fff); }
</style>
</head>
<body>
<div id="root" data-composition-id="cr06" data-start="0" data-duration="3.5" data-width="1080" data-height="1920">
  <div class="hoja"></div>
  <div class="capa">
    <div id="cr06-cab"><div id="cr06-num" data-lu="numero"></div><div><div id="cr06-titulo" data-lu="titulo"></div><div id="cr06-tag" data-lu="tag"></div></div></div>
    <div id="cr06-marco"><div id="cr06-ph">tu captura aquí</div></div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  if (LU.vars.imagen) { const im = document.createElement('img'); im.src = LU.vars.imagen; document.querySelector('#cr06-marco').appendChild(im); document.querySelector('#cr06-ph').remove(); }
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#cr06-num', { scale: 0, rotate: -20 }, { scale: 1, rotate: 0, duration: .45, ease: 'back.out(2.4)' }, 0)
    .fromTo('#cr06-titulo', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .35, ease: 'power3.out' }, .2)
    .fromTo('#cr06-tag', { scale: 0 }, { scale: 1, duration: .35, ease: 'back.out(2.5)' }, .35)
    .fromTo('#cr06-marco', { y: 300, opacity: 0, rotate: 4 }, { y: 0, opacity: 1, rotate: 0, duration: .6, ease: 'back.out(1.4)' }, .3)
    .to('#cr06-marco', { scale: 1.02, duration: 2, ease: 'sine.inOut' }, 1)
    .to('.capa', { opacity: 0, y: -30, duration: .3, ease: 'power2.in' }, 3.2);
  window.__timelines = window.__timelines || {};
  window.__timelines["cr06"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
