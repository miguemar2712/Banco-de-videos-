<!doctype html>
<html lang="es" data-zona="panel" data-composition-variables='[
  {"id": "pregunta", "type": "string", "label": "Pregunta", "default": "¿Cómo editar con"},
  {"id": "tema", "type": "string", "label": "Tema (grande)", "default": "CLAUDE?"},
  {"id": "chip", "type": "string", "label": "Etiqueta", "default": "Es más simple de lo que crees"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "hoja"},
  {"id": "tinta", "type": "color", "label": "Color texto", "default": "#3A2A1F"},
  {"id": "acento", "type": "color", "label": "Color acento", "default": "#C9A15F"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "panel"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  #tu01-g { position: absolute; left: 0; right: 0; top: 190px; text-align: center; }
  #tu01-p { font: 700 64px var(--sans); color: var(--tinta); letter-spacing: -1.5px; }
  #tu01-t { font: 900 170px/1 var(--sans); letter-spacing: -6px; color: var(--acento); margin-top: 6px; white-space: nowrap; }
  #tu01-chip { display: inline-block; margin-top: 22px; font: 600 36px var(--body); color: var(--papel); background: var(--tinta); padding: 10px 26px; border-radius: 999px; }
  #tu01-barras { position: absolute; left: 340px; right: 340px; top: 680px; height: 200px; display: flex; align-items: flex-end; gap: 14px; }
  #tu01-barras i { flex: 1; border-radius: 8px 8px 3px 3px; background: linear-gradient(var(--acento), color-mix(in srgb, var(--acento) 50%, var(--tinta))); transform-origin: bottom; }
</style>
</head>
<body>
<div id="root" data-composition-id="tu01" data-start="0" data-duration="3.5" data-width="1080" data-height="1920">
  <div class="hoja"></div>
  <div class="capa mitad">
    <div id="tu01-g"><div id="tu01-p" data-lu="pregunta"></div><div id="tu01-t" data-lu="tema"></div><div id="tu01-chip" data-lu="chip"></div></div>
    <div id="tu01-barras"></div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  const t = document.querySelector('#tu01-t'); if (t.textContent.length > 9) t.style.fontSize = Math.max(80, 170 * 9 / t.textContent.length) + 'px';
  const b = document.querySelector('#tu01-barras'); [30, 45, 38, 60, 72, 66, 88, 100].forEach((h) => { const i = document.createElement('i'); i.style.height = h + '%'; b.appendChild(i); });
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#tu01-p', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .45, ease: 'power3.out' }, 0)
    .fromTo('#tu01-t', { scale: .6, opacity: 0, filter: 'blur(12px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: .55, ease: 'expo.out' }, .2)
    .fromTo('#tu01-chip', { scale: 0 }, { scale: 1, duration: .4, ease: 'back.out(2.4)' }, .6)
    .fromTo('#tu01-barras i', { scaleY: 0 }, { scaleY: 1, duration: .4, stagger: .07, ease: 'back.out(1.8)' }, .7)
    .to('.capa', { opacity: 0, y: -30, duration: .3, ease: 'power2.in' }, 3.2);
  window.__timelines = window.__timelines || {};
  window.__timelines["tu01"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
