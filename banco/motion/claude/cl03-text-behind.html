<!doctype html>
<html lang="es" data-zona="libre" data-composition-variables='[
  {"id": "palabra", "type": "string", "label": "Palabra gigante", "default": "VIRAL"},
  {"id": "cabeza", "type": "number", "label": "Altura del centro de tu cabeza (px)", "default": 580},
  {"id": "blanco", "type": "color", "label": "Color", "default": "#FFFFFF"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "transparente"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "libre"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  .hoja { background-color: #3a3a40; }
  #cl03-p { position: absolute; left: 120px; width: 840px; text-align: center; font-family: 'Anton', sans-serif; line-height: 1; color: var(--blanco); text-transform: uppercase; white-space: nowrap; text-shadow: 0 10px 40px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div id="root" data-composition-id="cl03" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <div class="hoja"></div>
  <div class="capa"><div id="cl03-p" data-lu="palabra"></div></div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  // ~330 px de alto; si no cabe en x 120–960 se encoge
  const p = document.querySelector('#cl03-p');
  let tam = 400; p.style.fontSize = tam + 'px';
  while (p.scrollWidth > 840 && tam > 80) { tam -= 4; p.style.fontSize = tam + 'px'; }
  p.style.top = ((+LU.vars.cabeza || 580) - tam * 0.62) + 'px';
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(p, { y: 160, opacity: 0, filter: 'blur(18px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 10 / 30, ease: 'power3.out' }, 0)
    .to(p, { y: -20, duration: 65 / 30, ease: 'none' }, 10 / 30)
    .to(p, { y: 120, opacity: 0, filter: 'blur(10px)', duration: 15 / 30, ease: 'power3.in' }, 75 / 30);
  window.__timelines = window.__timelines || {};
  window.__timelines["cl03"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
