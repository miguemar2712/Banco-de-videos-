<!doctype html>
<html lang="es" data-zona="libre" data-composition-variables='[
  {"id": "etiqueta", "type": "string", "label": "Etiqueta", "default": "Level Up"},
  {"id": "titulo", "type": "string", "label": "Título brillante", "default": "Masterclass"},
  {"id": "sub", "type": "string", "label": "Subtítulo", "default": "Motion graphics con Claude"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "hoja"},
  {"id": "acento", "type": "color", "label": "Color luz", "default": "#C9A15F"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "libre"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  .hoja { display: none; }
  #ci01-anillo { position: absolute; left: 540px; top: 330px; width: 1300px; height: 1300px; margin: -650px 0 0 -650px; border-radius: 50%;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--acento) 85%, #fff), 0 0 60px 12px color-mix(in srgb, var(--acento) 80%, transparent), 0 0 220px 60px color-mix(in srgb, var(--acento) 40%, transparent), inset 0 0 120px 30px color-mix(in srgb, var(--acento) 35%, transparent);
    background: radial-gradient(circle, #050403 62%, transparent 70%); }
  #ci01-g { position: absolute; left: 0; right: 0; top: 1080px; text-align: center; }
  #ci01-titulo { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 150px; letter-spacing: -6px; line-height: 1.05; margin-top: 26px; }
  #ci01-sub { font: 600 62px 'Inter', sans-serif; color: #F7F1E8; letter-spacing: -1.5px; margin-top: 18px; }
</style>
</head>
<body>
<div id="root" data-composition-id="ci01" data-start="0" data-duration="4" data-width="1080" data-height="1920">
  <div class="cine"></div>
  <div class="capa">
    <div id="ci01-anillo"></div>
    <div id="ci01-g">
      <span class="pildora" id="ci01-et"><i></i><span data-lu="etiqueta"></span></span>
      <div id="ci01-titulo" class="brillo-oro" data-lu="titulo"></div>
      <div id="ci01-sub" data-lu="sub"></div>
    </div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  const letras = LU.split(document.querySelector('#ci01-titulo'), 'letras');
  letras.forEach((l) => l.classList.add('oro-txt'));
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#ci01-anillo', { scale: .55, opacity: 0, rotate: -20 }, { scale: 1, opacity: 1, rotate: 0, duration: 1.4, ease: 'expo.out' }, 0)
    .fromTo('#ci01-et', { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: 'power3.out' }, .5)
    .fromTo(letras, { y: 60, opacity: 0, filter: 'blur(12px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: .7, ease: 'expo.out', stagger: .035 }, .65)
    .fromTo('#ci01-sub', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .6, ease: 'power3.out' }, 1.2)
    .to('#ci01-anillo', { scale: 1.06, rotate: 8, duration: 2.4, ease: 'sine.inOut' }, 1.4)
    .to('#ci01-g', { y: -20, duration: 2.4, ease: 'sine.inOut' }, 1.4)
    .to('.capa', { opacity: 0, duration: .4 }, 3.6);
  window.__timelines = window.__timelines || {};
  window.__timelines["ci01"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
