<!doctype html>
<html lang="es" data-zona="panel" data-composition-variables='[
  {"id": "etiqueta", "type": "string", "label": "Etiqueta arriba", "default": "02 motion graphics"},
  {"id": "valor", "type": "number", "label": "Número", "default": 39},
  {"id": "texto", "type": "string", "label": "Texto debajo", "default": "cortes en tu CapCut"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "hoja"},
  {"id": "tinta", "type": "color", "label": "Color texto", "default": "#3A2A1F"},
  {"id": "acento", "type": "color", "label": "Color barra destacada", "default": "#C9A15F"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "panel"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  #tu09-et { position: absolute; left: 70px; top: 90px; font: 500 30px var(--mono); color: var(--tinta2); }
  #tu09-et::first-letter { color: var(--acento); }
  #tu09-num { position: absolute; left: 70px; top: 130px; font: 900 220px/1 var(--sans); letter-spacing: -10px; color: var(--tinta); }
  #tu09-txt { position: absolute; left: 76px; top: 370px; font: 500 40px var(--body); color: var(--tinta2); }
  #tu09-b { position: absolute; left: 70px; right: 70px; top: 470px; height: 400px; display: flex; align-items: flex-end; gap: 8px; }
  #tu09-b i { flex: 1; background: var(--tinta); border-radius: 4px 4px 0 0; transform-origin: bottom; opacity: .85; }
  #tu09-b i.d { background: var(--acento); opacity: 1; box-shadow: 0 0 20px color-mix(in srgb, var(--acento) 60%, transparent); }
</style>
</head>
<body>
<div id="root" data-composition-id="tu09" data-start="0" data-duration="3.5" data-width="1080" data-height="1920">
  <div class="hoja"></div>
  <div class="capa mitad">
    <div id="tu09-et" data-lu="etiqueta"></div>
    <div id="tu09-num">0</div>
    <div id="tu09-txt" data-lu="texto"></div>
    <div id="tu09-b"></div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  const r = LU.rand(9), b = document.querySelector('#tu09-b');
  const barras = Array.from({ length: 34 }, (_, i) => { const e = document.createElement('i'); e.style.height = (i === 9 ? 100 : 15 + r() * 70) + '%'; if (i === 9) e.className = 'd'; b.appendChild(e); return e; });
  const num = document.querySelector('#tu09-num'), n = { v: 0 }, fin = +LU.vars.valor || 0;
  const pinta = () => { num.textContent = Math.round(n.v); };
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#tu09-et', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .35 }, 0)
    .fromTo(n, { v: 0 }, { v: fin, duration: 1.1, ease: 'power3.out', onUpdate: pinta }, .1)
    .fromTo('#tu09-txt', { opacity: 0 }, { opacity: 1, duration: .4 }, .5)
    .fromTo(barras, { scaleY: 0 }, { scaleY: 1, duration: .35, stagger: .02, ease: 'back.out(1.6)' }, .3)
    .to(barras.filter((e) => !e.classList.contains('d')), { opacity: .35, duration: .3 }, 1.6)
    .to('#tu09-num', { scale: 1.06, duration: .12, yoyo: true, repeat: 1, transformOrigin: 'left center' }, 1.2)
    .to('.capa', { opacity: 0, duration: .25 }, 3.25);
  window.__timelines = window.__timelines || {};
  window.__timelines["tu09"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
