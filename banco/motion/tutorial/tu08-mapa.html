<!doctype html>
<html lang="es" data-zona="panel" data-composition-variables='[
  {"id": "centro", "type": "string", "label": "Centro", "default": "tu video"},
  {"id": "ramas", "type": "string", "label": "Ramas (separadas por coma)", "default": "hook,b-roll,títulos,color,sonidos,portada"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "hoja"},
  {"id": "tinta", "type": "color", "label": "Color texto", "default": "#3A2A1F"},
  {"id": "acento", "type": "color", "label": "Color centro", "default": "#C9A15F"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "panel"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  #tu08-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; }
  #tu08-c { position: absolute; left: 540px; top: 480px; transform: translate(-50%, -50%); font: italic 600 64px var(--serif); color: #3A2A1F; background: var(--acento); padding: 18px 44px; border-radius: 999px; box-shadow: var(--sombra); white-space: nowrap; }
  .tu08-n { position: absolute; transform: translate(-50%, -50%); font: 700 40px var(--sans); color: #3A2A1F; background: #FFFDF8; padding: 12px 30px; border-radius: 999px; box-shadow: var(--sombra); white-space: nowrap; }
</style>
</head>
<body>
<div id="root" data-composition-id="tu08" data-start="0" data-duration="4" data-width="1080" data-height="1920">
  <div class="hoja"></div>
  <div class="capa mitad" id="tu08-capa">
    <svg id="tu08-svg" viewBox="0 0 1080 960"></svg>
    <div id="tu08-c" data-lu="centro"></div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  const capa = document.querySelector('#tu08-capa'), svg = document.querySelector('#tu08-svg'), NS = 'http://www.w3.org/2000/svg';
  const ramas = String(LU.vars.ramas).split(',').map((s) => s.trim()).filter(Boolean).slice(0, 8);
  const lineas = [], nodos = [];
  ramas.forEach((t, i) => {
    const a = -Math.PI / 2 + (i / ramas.length) * Math.PI * 2 + .3, x = 540 + Math.cos(a) * 390, y = 480 + Math.sin(a) * 330;
    const p = document.createElementNS(NS, 'path'); const cx = 540 + Math.cos(a) * 150, cy = 480 + Math.sin(a) * 40;
    p.setAttribute('d', `M540 480 Q ${cx} ${cy} ${x} ${y}`); p.setAttribute('fill', 'none'); p.setAttribute('stroke', i === 0 ? 'var(--acento)' : 'var(--tinta)'); p.setAttribute('stroke-width', 4); p.setAttribute('pathLength', 1); p.setAttribute('stroke-dasharray', 1); p.setAttribute('stroke-dashoffset', 1);
    svg.appendChild(p); lineas.push(p);
    const n = document.createElement('div'); n.className = 'tu08-n'; n.textContent = t; n.style.left = x + 'px'; n.style.top = y + 'px'; capa.appendChild(n); nodos.push(n);
  });
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#tu08-c', { scale: 0 }, { scale: 1, duration: .5, ease: 'back.out(2.4)' }, 0);
  lineas.forEach((l, i) => {
    tl.to(l, { attr: { 'stroke-dashoffset': 0 }, duration: .35, ease: 'power2.out' }, .4 + i * .18)
      .fromTo(nodos[i], { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: .35, ease: 'back.out(2.6)' }, .6 + i * .18);
  });
  tl.to(nodos, { y: -8, duration: .7, yoyo: true, repeat: 1, ease: 'sine.inOut', stagger: .08 }, 2.2)
    .to('.capa', { opacity: 0, duration: .25 }, 3.75);
  window.__timelines = window.__timelines || {};
  window.__timelines["tu08"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
