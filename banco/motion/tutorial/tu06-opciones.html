<!doctype html>
<html lang="es" data-zona="panel" data-composition-variables='[
  {"id": "titulo", "type": "string", "label": "Título", "default": "Elige tu estilo"},
  {"id": "opciones", "type": "string", "label": "4 opciones (separadas por coma)", "default": "🎙️ A cámara,🎧 Voz en off,🖥️ Tutorial,🎬 Cinemático"},
  {"id": "elegida", "type": "number", "label": "Opción elegida (1-4)", "default": 1},
  {"id": "nota", "type": "string", "label": "Nota sobre la elegida", "default": "El más usado"},
  {"id": "busca", "type": "string", "label": "Búsqueda (opcional)", "default": "mi-video.mov"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "hoja"},
  {"id": "tinta", "type": "color", "label": "Color texto", "default": "#3A2A1F"},
  {"id": "acento", "type": "color", "label": "Color selección", "default": "#C9A15F"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "panel"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  #tu06-titulo { position: absolute; left: 70px; top: 110px; }
  #tu06-grid { position: absolute; left: 70px; right: 70px; top: 250px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .tu06-o { height: 150px; display: flex; align-items: center; padding: 0 34px; font: 700 48px var(--sans); color: #3A2A1F; position: relative; }
  .tu06-o.sel { box-shadow: 0 0 0 5px var(--acento), var(--sombra); }
  .tu06-nota { position: absolute; left: 24px; top: -22px; font: 700 24px var(--sans); color: var(--tinta); background: var(--acento); padding: 4px 14px; border-radius: 8px; white-space: nowrap; }
  #tu06-busca { position: absolute; left: 70px; right: 70px; top: 640px; height: 110px; border-radius: 55px; display: flex; align-items: center; gap: 20px; padding: 0 36px; font: 600 44px var(--body); color: #3A2A1F; }
  #tu06-cur { display: inline-block; width: 3px; height: 46px; background: var(--acento); vertical-align: middle; }
</style>
</head>
<body>
<div id="root" data-composition-id="tu06" data-start="0" data-duration="4" data-width="1080" data-height="1920">
  <div class="hoja"></div>
  <div class="capa mitad">
    <div id="tu06-titulo" class="tu-titulo" data-lu="titulo"></div>
    <div id="tu06-grid"></div>
    <div id="tu06-busca" class="tarjeta">🔍 <span id="tu06-b"></span><span id="tu06-cur"></span></div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  const grid = document.querySelector('#tu06-grid'), sel = (+LU.vars.elegida || 1) - 1;
  const os = String(LU.vars.opciones).split(',').map((s) => s.trim()).filter(Boolean).slice(0, 4).map((t) => { const o = document.createElement('div'); o.className = 'tu06-o tarjeta'; o.textContent = t; grid.appendChild(o); return o; });
  const elegida = os[sel], otras = os.filter((o, i) => i !== sel);
  if (elegida && LU.vars.nota) { const n = document.createElement('div'); n.className = 'tu06-nota'; n.textContent = LU.vars.nota; elegida.appendChild(n); }
  const busca = String(LU.vars.busca || ''), b = document.querySelector('#tu06-b'), k = { v: 0 };
  const pinta = () => { b.textContent = busca.slice(0, Math.round(k.v)); };
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#tu06-titulo', { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: .4, ease: 'power3.out' }, 0)
    .fromTo(os, { scale: .7, opacity: 0 }, { scale: 1, opacity: 1, duration: .4, stagger: .08, ease: 'back.out(2)' }, .15)
    .set(elegida, { attr: { class: 'tu06-o tarjeta sel' } }, 1.0)
    .fromTo(elegida, { scale: 1.08 }, { scale: 1, duration: .35, ease: 'back.out(3)', immediateRender: false }, 1.0)
    .to(otras, { opacity: .35, duration: .3 }, 1.0)
    .fromTo('.tu06-nota', { scale: 0 }, { scale: 1, duration: .3, ease: 'back.out(3)' }, 1.15);
  if (busca) tl.fromTo('#tu06-busca', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .4, ease: 'power3.out' }, 1.6).fromTo(k, { v: 0 }, { v: busca.length, duration: .7, ease: 'none', onUpdate: pinta }, 1.9);
  else tl.set('#tu06-busca', { opacity: 0 }, 0);
  tl.to('.capa', { opacity: 0, duration: .25 }, 3.75);
  window.__timelines = window.__timelines || {};
  window.__timelines["tu06"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
