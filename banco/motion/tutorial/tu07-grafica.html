<!doctype html>
<html lang="es" data-zona="panel" data-composition-variables='[
  {"id": "titulo", "type": "string", "label": "Título", "default": "Así crecieron mis vistas"},
  {"id": "par", "type": "string", "label": "Par / activo", "default": "Instagram · 30 días"},
  {"id": "techo", "type": "string", "label": "Etiqueta techo", "default": "RÉCORD"},
  {"id": "piso", "type": "string", "label": "Etiqueta piso", "default": "INICIO"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "hoja"},
  {"id": "tinta", "type": "color", "label": "Color texto", "default": "#3A2A1F"},
  {"id": "acento", "type": "color", "label": "Color marcas", "default": "#C9A15F"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "panel"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  #tu07-titulo { position: absolute; left: 70px; right: 70px; top: 100px; font-size: 54px; }
  #tu07-panel { position: absolute; left: 50px; right: 50px; top: 210px; height: 680px; padding: 24px 28px; }
  #tu07-cab { font: 700 30px var(--sans); color: var(--tinta); display: flex; justify-content: space-between; }
  #tu07-cab b { color: #2BB673; }
  #tu07-svg { position: absolute; left: 28px; right: 28px; top: 80px; bottom: 24px; }
  .tu07-et { position: absolute; font: 800 26px var(--sans); color: #fff; padding: 6px 14px; border-radius: 8px; }
</style>
</head>
<body>
<div id="root" data-composition-id="tu07" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
  <div class="hoja"></div>
  <div class="capa mitad">
    <div id="tu07-titulo" class="tu-titulo" data-lu="titulo"></div>
    <div id="tu07-panel" class="tarjeta">
      <div id="tu07-cab"><span data-lu="par"></span><b id="tu07-precio">1.0864</b></div>
      <svg id="tu07-svg" viewBox="0 0 924 576"></svg>
      <div class="tu07-et" id="tu07-et1" style="left:40px;top:118px;background:#D9534F" data-lu="techo"></div>
      <div class="tu07-et" id="tu07-et2" style="left:40px;top:560px;background:#2BB673" data-lu="piso"></div>
    </div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  const svg = document.querySelector('#tu07-svg'), NS = 'http://www.w3.org/2000/svg', r = LU.rand(21);
  const TECHO = 90, PISO = 470;
  // precio en zigzag entre techo y piso
  const puntos = []; let y = 420;
  for (let i = 0; i < 46; i++) { const fase = Math.sin(i / 46 * Math.PI * 6.2 - 1.2); y = (TECHO + PISO) / 2 - fase * (PISO - TECHO) / 2 * .95 + (r() - .5) * 22; puntos.push(y); }
  const velas = puntos.map((c, i) => {
    const o = i ? puntos[i - 1] : c + 10, sube = c < o, x = 40 + i * 19;
    const g = document.createElementNS(NS, 'g');
    const mecha = document.createElementNS(NS, 'line'); mecha.setAttribute('x1', x); mecha.setAttribute('x2', x); mecha.setAttribute('y1', Math.min(o, c) - 10 - r() * 10); mecha.setAttribute('y2', Math.max(o, c) + 10 + r() * 10); mecha.setAttribute('stroke', sube ? '#2BB673' : '#D9534F'); mecha.setAttribute('stroke-width', 2);
    const cuerpo = document.createElementNS(NS, 'rect'); cuerpo.setAttribute('x', x - 6); cuerpo.setAttribute('width', 12); cuerpo.setAttribute('y', Math.min(o, c)); cuerpo.setAttribute('height', Math.max(4, Math.abs(o - c))); cuerpo.setAttribute('fill', sube ? '#2BB673' : '#D9534F'); cuerpo.setAttribute('rx', 2);
    g.appendChild(mecha); g.appendChild(cuerpo); svg.appendChild(g); return g;
  });
  const linea = (yy, color, id) => { const l = document.createElementNS(NS, 'line'); l.setAttribute('x1', 0); l.setAttribute('x2', 924); l.setAttribute('y1', yy); l.setAttribute('y2', yy); l.setAttribute('stroke', color); l.setAttribute('stroke-width', 4); l.setAttribute('stroke-dasharray', '14 10'); l.id = id; svg.appendChild(l); return l; };
  linea(TECHO - 14, '#D9534F', 'tu07-lt'); linea(PISO + 14, '#2BB673', 'tu07-lp');
  // marcas en los toques
  const toques = []; puntos.forEach((p, i) => { if (i > 0 && i < puntos.length - 1 && ((p < puntos[i - 1] && p < puntos[i + 1] && p < TECHO + 60) || (p > puntos[i - 1] && p > puntos[i + 1] && p > PISO - 60))) toques.push([40 + i * 19, p]); });
  const marcas = toques.slice(0, 7).map(([x, yy]) => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', yy); c.setAttribute('r', 20); c.setAttribute('fill', 'none'); c.setAttribute('stroke', 'var(--acento)'); c.setAttribute('stroke-width', 5); svg.appendChild(c); return c; });
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#tu07-titulo', { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: .4 }, 0)
    .fromTo('#tu07-panel', { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: 'expo.out' }, .1)
    .fromTo(velas, { opacity: 0, scaleY: 0, transformOrigin: '50% 50%' }, { opacity: 1, scaleY: 1, duration: .15, stagger: .035, ease: 'power2.out' }, .4)
    .fromTo(marcas, { scale: 0, transformOrigin: '50% 50%', opacity: 0 }, { scale: 1, opacity: 1, duration: .3, stagger: .12, ease: 'back.out(3)' }, 2.1)
    .fromTo(['#tu07-lt', '#tu07-lp'], { opacity: 0 }, { opacity: 1, duration: .3, stagger: .2 }, 2.9)
    .fromTo(['#tu07-et1', '#tu07-et2'], { scale: 0 }, { scale: 1, duration: .3, stagger: .2, ease: 'back.out(3)' }, 3.0)
    .to('.capa', { opacity: 0, duration: .25 }, 4.25);
  window.__timelines = window.__timelines || {};
  window.__timelines["tu07"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
