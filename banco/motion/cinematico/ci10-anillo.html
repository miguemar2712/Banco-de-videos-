<!doctype html>
<html lang="es" data-zona="elementos" data-composition-variables='[
  {"id": "valor", "type": "number", "label": "Número final", "default": 100},
  {"id": "sufijo", "type": "string", "label": "Después del número", "default": "%"},
  {"id": "texto", "type": "string", "label": "Texto", "default": "automático"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "transparente"},
  {"id": "acento", "type": "color", "label": "Color anillo", "default": "#C9A15F"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "elementos"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  .hoja { display: none; }
  #ci10-g { position: absolute; left: 340px; top: 170px; width: 400px; height: 400px; }
  #ci10-g svg { position: absolute; inset: 0; transform: rotate(-90deg); filter: drop-shadow(0 0 18px color-mix(in srgb, var(--acento) 60%, transparent)); }
  #ci10-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #ci10-v { font: 800 120px 'Inter'; letter-spacing: -5px; line-height: 1; }
  #ci10-t { font: 600 32px 'Inter'; color: #CBB99F; margin-top: 6px; }
  #ci10-disco { position: absolute; inset: 24px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, rgba(40,30,22,.85), rgba(15,11,9,.85)); box-shadow: inset 0 1px 0 rgba(255,255,255,.15); }
</style>
</head>
<body>
<div id="root" data-composition-id="ci10" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <div class="cine"></div>
  <div class="capa">
    <div id="ci10-g">
      <div id="ci10-disco"></div>
      <svg viewBox="0 0 400 400"><circle cx="200" cy="200" r="180" fill="none" stroke="rgba(241,217,166,.15)" stroke-width="16"/>
        <circle id="ci10-arco" cx="200" cy="200" r="180" fill="none" stroke="url(#ci10-gr)" stroke-width="16" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
        <defs><linearGradient id="ci10-gr"><stop offset="0" stop-color="#9C7238"/><stop offset="1" stop-color="#F1D9A6"/></linearGradient></defs></svg>
      <div id="ci10-num"><div id="ci10-v" class="oro-txt"><span id="ci10-n">0</span><span id="ci10-s"></span></div><div id="ci10-t" data-lu="texto"></div></div>
    </div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  document.querySelector('#ci10-s').textContent = LU.vars.sufijo || '';
  const n = { v: 0 }, el = document.querySelector('#ci10-n'), fin = +LU.vars.valor || 0;
  const pinta = () => { el.textContent = Math.round(n.v); };
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#ci10-g', { scale: .6, opacity: 0, rotate: -30 }, { scale: 1, opacity: 1, rotate: 0, duration: .6, ease: 'expo.out' }, 0)
    .to('#ci10-arco', { attr: { 'stroke-dashoffset': 0 }, duration: 1.5, ease: 'power2.inOut' }, .3)
    .fromTo(n, { v: 0 }, { v: fin, duration: 1.5, ease: 'power2.inOut', onUpdate: pinta }, .3)
    .to('#ci10-g', { scale: 1.06, duration: .15, yoyo: true, repeat: 1 }, 1.8)
    .to('#ci10-g', { opacity: 0, scale: .9, duration: .3, ease: 'power2.in' }, 2.7);
  window.__timelines = window.__timelines || {};
  window.__timelines["ci10"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
