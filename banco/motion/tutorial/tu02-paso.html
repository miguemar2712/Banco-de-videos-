<!doctype html>
<html lang="es" data-zona="panel" data-composition-variables='[
  {"id": "paso", "type": "number", "label": "Número de paso", "default": 1},
  {"id": "total", "type": "number", "label": "Total de pasos", "default": 3},
  {"id": "titulo", "type": "string", "label": "Título del paso", "default": "Abre Claude Code"},
  {"id": "detalle", "type": "string", "label": "Detalle (opcional)", "default": "y crea una carpeta para tu video"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "hoja"},
  {"id": "tinta", "type": "color", "label": "Color texto", "default": "#3A2A1F"},
  {"id": "acento", "type": "color", "label": "Color acento", "default": "#C9A15F"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "panel"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  #tu02-cab { position: absolute; left: 70px; right: 70px; top: 120px; display: flex; justify-content: space-between; align-items: flex-start; }
  #tu02-dots { display: flex; gap: 12px; margin-top: 4px; }
  .tu02-d { width: 50px; height: 50px; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--tinta) 30%, transparent); display: flex; align-items: center; justify-content: center; font: 800 24px var(--sans); color: color-mix(in srgb, var(--tinta) 45%, transparent); }
  .tu02-d.hecho { background: var(--tinta); border-color: var(--tinta); color: var(--papel); }
  .tu02-d.actual { background: var(--acento); border-color: var(--acento); color: var(--tinta); }
  #tu02-titulo { margin-top: 18px; }
  #tu02-num { position: absolute; right: 60px; top: 330px; font: 900 420px/0.8 var(--serif); color: color-mix(in srgb, var(--acento) 30%, transparent); }
  #tu02-det { font: 500 40px var(--body); color: var(--tinta2); margin-top: 10px; }
</style>
</head>
<body>
<div id="root" data-composition-id="tu02" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <div class="hoja"></div>
  <div class="capa mitad">
    <div id="tu02-num"></div>
    <div id="tu02-cab"><div><span class="tu-badge" id="tu02-badge"></span><div class="tu-titulo" id="tu02-titulo" data-lu="titulo"></div><div id="tu02-det" data-lu="detalle"></div></div><div id="tu02-dots"></div></div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  const paso = +LU.vars.paso || 1, total = +LU.vars.total || 3;
  document.querySelector('#tu02-badge').textContent = 'Paso ' + paso;
  document.querySelector('#tu02-num').textContent = paso;
  const dots = document.querySelector('#tu02-dots');
  const ds = Array.from({ length: total }, (_, i) => { const d = document.createElement('div'); d.className = 'tu02-d' + (i + 1 < paso ? ' hecho' : ''); d.textContent = i + 1 < paso ? '✓' : i + 1; dots.appendChild(d); return d; });
  const actual = ds[paso - 1];
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#tu02-badge', { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: .4, ease: 'power3.out' }, 0)
    .fromTo('#tu02-titulo', { y: 30, opacity: 0, filter: 'blur(8px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: .5, ease: 'power3.out' }, .15)
    .fromTo('#tu02-det', { opacity: 0 }, { opacity: 1, duration: .4 }, .45)
    .fromTo(ds, { scale: 0 }, { scale: 1, duration: .3, stagger: .08, ease: 'back.out(2.5)' }, .2);
  if (actual) tl.set(actual, { attr: { class: 'tu02-d actual' } }, .7).fromTo(actual, { scale: 1.5 }, { scale: 1, duration: .4, ease: 'back.out(3)', immediateRender: false }, .7);
  tl.fromTo('#tu02-num', { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: .7, ease: 'expo.out' }, .1)
    .to('.capa', { opacity: 0, duration: .25 }, 2.75);
  window.__timelines = window.__timelines || {};
  window.__timelines["tu02"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
