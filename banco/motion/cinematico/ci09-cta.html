<!doctype html>
<html lang="es" data-zona="pantalla" data-composition-variables='[
  {"id": "etiqueta", "type": "string", "label": "Etiqueta", "default": "Gratis"},
  {"id": "titulo", "type": "string", "label": "Título", "default": "Mis skills de edición"},
  {"id": "detalle", "type": "string", "label": "Detalle", "default": "Te llegan al privado en segundos"},
  {"id": "boton", "type": "string", "label": "Botón", "default": "Comenta CLAUDE"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "hoja"},
  {"id": "acento", "type": "color", "label": "Color botón", "default": "#C9A15F"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "pantalla"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  .hoja { display: none; }
  #ci09-card { position: absolute; left: 110px; right: 110px; top: 170px; padding: 40px 44px; text-align: center; }
  #ci09-titulo { font: 800 76px 'Inter'; letter-spacing: -2.5px; line-height: 1.05; color: #F7F1E8; margin: 22px 0 12px; }
  #ci09-detalle { font: 500 36px 'Inter'; color: #CBB99F; }
  #ci09-boton { position: absolute; left: 110px; right: 110px; top: 610px; height: 128px; border-radius: 70px; display: flex; align-items: center; justify-content: center; gap: 18px;
    font: 800 52px 'Inter'; color: #1A1410; background: linear-gradient(135deg, #F7E3B8, var(--acento) 60%, #A87B3E); box-shadow: 0 0 0 2px rgba(255,255,255,.3) inset, 0 20px 60px color-mix(in srgb, var(--acento) 55%, transparent); }
  #ci09-brillo { position: absolute; inset: 0; border-radius: 70px; background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.65) 50%, transparent 70%); }
  #ci09-abajo { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font: 600 30px 'Inter'; color: #F1D9A6; text-shadow: 0 2px 12px rgba(0,0,0,.7); }
</style>
</head>
<body>
<div id="root" data-composition-id="ci09" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
  <div class="cine"></div>
  <div class="capa">
    <div id="ci09-card" class="vidrio">
      <span class="pildora"><i></i><span data-lu="etiqueta"></span></span>
      <div id="ci09-titulo" data-lu="titulo"></div>
      <div id="ci09-detalle" data-lu="detalle"></div>
    </div>
    <div id="ci09-boton"><span data-lu="boton"></span> →<div id="ci09-brillo"></div></div>
    <div id="ci09-abajo">👇 en los comentarios</div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#ci09-card', { y: 70, opacity: 0, scale: .94 }, { y: 0, opacity: 1, scale: 1, duration: .6, ease: 'expo.out' }, 0)
    .fromTo('#ci09-titulo', { opacity: 0, filter: 'blur(10px)' }, { opacity: 1, filter: 'blur(0px)', duration: .5 }, .25)
    .fromTo('#ci09-detalle', { opacity: 0 }, { opacity: 1, duration: .4 }, .5)
    .fromTo('#ci09-boton', { y: 60, opacity: 0, scale: .9 }, { y: 0, opacity: 1, scale: 1, duration: .55, ease: 'back.out(1.8)' }, .65)
    .fromTo('#ci09-brillo', { xPercent: -120 }, { xPercent: 120, duration: .9, ease: 'power2.inOut' }, 1.3)
    .to('#ci09-boton', { scale: 1.04, duration: .45, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 1.6)
    .fromTo('#ci09-abajo', { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: .4 }, 1.4)
    .fromTo('#ci09-brillo', { xPercent: -120 }, { xPercent: 120, duration: .9, ease: 'power2.inOut', immediateRender: false }, 2.9)
    .to('.capa', { opacity: 0, duration: .35 }, 4.15);
  window.__timelines = window.__timelines || {};
  window.__timelines["ci09"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
