<!doctype html>
<html lang="es" data-zona="elementos" data-composition-variables='[
  {"id": "titulo", "type": "string", "label": "Etiqueta", "default": "Cortando lo que sobra"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "transparente"},
  {"id": "acento", "type": "color", "label": "Color acento", "default": "#C9A15F"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "elementos"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  .hoja { display: none; }
  #ci03-panel { position: absolute; left: 50px; right: 50px; top: 200px; height: 420px; padding: 28px 30px; }
  #ci03-cab { display: flex; justify-content: space-between; align-items: center; font: 600 28px 'Inter'; color: #CBB99F; margin-bottom: 24px; }
  #ci03-cab b { color: #F7F1E8; font-weight: 700; }
  #ci03-tc { font-family: var(--mono); color: var(--acento); }
  #ci03-clips { position: relative; height: 120px; display: flex; gap: 10px; }
  .ci03-c { height: 120px; border-radius: 16px; background: linear-gradient(135deg, #6b5643, #3b2e24); box-shadow: inset 0 0 0 2px rgba(241,217,166,.25); transform-origin: center; }
  .ci03-c.x { background: repeating-linear-gradient(45deg, rgba(229,72,77,.35) 0 14px, rgba(229,72,77,.15) 14px 28px); box-shadow: inset 0 0 0 2px rgba(229,72,77,.7); }
  #ci03-onda { height: 110px; margin-top: 22px; display: flex; align-items: center; gap: 4px; }
  #ci03-onda i { flex: 1; border-radius: 3px; background: color-mix(in srgb, var(--acento) 80%, #fff); opacity: .85; }
  #ci03-cabezal { position: absolute; top: 96px; bottom: 26px; left: 30px; width: 4px; background: #fff; box-shadow: 0 0 16px #fff; border-radius: 3px; }
  #ci03-cabezal::before { content: ''; position: absolute; top: -14px; left: -10px; border: 12px solid transparent; border-top-color: #fff; }
</style>
</head>
<body>
<div id="root" data-composition-id="ci03" data-start="0" data-duration="4" data-width="1080" data-height="1920">
  <div class="cine"></div>
  <div class="capa">
    <div id="ci03-panel" class="vidrio">
      <div id="ci03-cab"><b data-lu="titulo"></b><span id="ci03-tc">00:00:00</span></div>
      <div id="ci03-clips"></div>
      <div id="ci03-onda"></div>
      <div id="ci03-cabezal"></div>
    </div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  const r = LU.rand(5), clips = document.querySelector('#ci03-clips'), onda = document.querySelector('#ci03-onda');
  const ANCHOS = [150, 70, 190, 60, 160, 80, 140], MALOS = [1, 3, 5];
  const cs = ANCHOS.map((w, i) => { const c = document.createElement('div'); c.className = 'ci03-c' + (MALOS.includes(i) ? ' x' : ''); c.style.width = w + 'px'; clips.appendChild(c); return c; });
  for (let i = 0; i < 70; i++) { const b = document.createElement('i'); b.style.height = (10 + r() * 95) + 'px'; onda.appendChild(b); }
  const malos = cs.filter((c, i) => MALOS.includes(i)), buenos = cs.filter((c, i) => !MALOS.includes(i));
  const tc = document.querySelector('#ci03-tc'), reloj = { s: 0 };
  const pinta = () => { const f = Math.floor(reloj.s * 30) % 30, s = Math.floor(reloj.s); tc.textContent = `00:${String(s).padStart(2, '0')}:${String(f).padStart(2, '0')}`; };
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#ci03-panel', { y: 80, opacity: 0, scale: .95 }, { y: 0, opacity: 1, scale: 1, duration: .6, ease: 'expo.out' }, 0)
    .fromTo(cs, { scaleY: 0 }, { scaleY: 1, duration: .35, stagger: .05, ease: 'back.out(2)' }, .2)
    .fromTo('#ci03-onda i', { scaleY: 0 }, { scaleY: 1, duration: .3, stagger: .006, ease: 'power2.out' }, .3)
    .fromTo('#ci03-cabezal', { x: 0 }, { x: 900, duration: 2.6, ease: 'none' }, .6)
    .fromTo(reloj, { s: 0 }, { s: 12, duration: 2.6, ease: 'none', onUpdate: pinta }, .6)
    .to(malos, { scaleY: 0, opacity: 0, duration: .3, stagger: .35, ease: 'back.in(2)' }, 1.2)
    .to(buenos, { x: (i) => [0, -80, -150, -230][i] || 0, duration: .5, ease: 'power3.inOut' }, 2.4)
    .to('.capa', { opacity: 0, duration: .35 }, 3.65);
  window.__timelines = window.__timelines || {};
  window.__timelines["ci03"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
