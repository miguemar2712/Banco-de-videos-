<!doctype html>
<html lang="es" data-zona="elementos" data-composition-variables='[
  {"id": "items", "type": "string", "label": "Etiquetas (separadas por coma)", "default": "preparar tus videos,textos,subtítulos,animaciones"},
  {"id": "final", "type": "string", "label": "Etiqueta final destacada", "default": "tu propio estilo"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "transparente"},
  {"id": "tinta", "type": "color", "label": "Color destacada", "default": "#5A2630"},
  {"id": "acento", "type": "color", "label": "Color etiquetas", "default": "#F6D6DB"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "elementos"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  :root { --papel: #F5E6DF; --tinta: #5A2630; --acento: #F6D6DB; }
  .cr08-e { position: absolute; font: 700 40px var(--sans); color: var(--tinta); background: #fff; padding: 10px 26px; border-radius: 999px; box-shadow: 0 10px 26px rgba(60,20,30,.2); white-space: nowrap; }
  .cr08-e:nth-child(even) { background: var(--acento); }
  #cr08-final { background: var(--tinta) !important; color: #fff; font-size: 48px; }
</style>
</head>
<body>
<div id="root" data-composition-id="cr08" data-start="0" data-duration="4" data-width="1080" data-height="1920">
  <div class="hoja"></div>
  <div class="capa" id="cr08-capa"></div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  const POS = [[70, 230, -4], [640, 200, 5], [110, 340, 3], [600, 330, -6], [380, 440, -2], [150, 520, 4]];
  const capa = document.querySelector('#cr08-capa');
  const items = String(LU.vars.items).split(',').map((s) => s.trim()).filter(Boolean).slice(0, 5);
  const els = items.map((t, i) => { const e = document.createElement('div'); e.className = 'cr08-e'; e.textContent = t; e.style.left = POS[i][0] + 'px'; e.style.top = POS[i][1] + 'px'; e.style.rotate = POS[i][2] + 'deg'; capa.appendChild(e); return e; });
  let fin = null;
  if (LU.vars.final) { fin = document.createElement('div'); fin.className = 'cr08-e'; fin.id = 'cr08-final'; fin.textContent = LU.vars.final; fin.style.left = '260px'; fin.style.top = (POS[items.length][1] + 30) + 'px'; fin.style.rotate = '-3deg'; capa.appendChild(fin); }
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(els, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: .4, ease: 'back.out(2.6)', stagger: .35 }, .05);
  if (fin) tl.fromTo(fin, { scale: 0, rotate: -20 }, { scale: 1, rotate: -3, duration: .5, ease: 'back.out(2.8)' }, .1 + els.length * .35);
  tl.to(els, { y: -12, duration: .8, yoyo: true, repeat: 1, ease: 'sine.inOut', stagger: .1 }, 2.0)
    .to('.cr08-e', { scale: 0, opacity: 0, duration: .2, stagger: .04, ease: 'back.in(2)' }, 3.6);
  window.__timelines = window.__timelines || {};
  window.__timelines["cr08"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
