<!doctype html>
<html lang="es" data-zona="elementos" data-composition-variables='[
  {"id": "numero", "type": "string", "label": "Número", "default": "5"},
  {"id": "palabra", "type": "string", "label": "Palabra", "default": "HORAS"},
  {"id": "nota", "type": "string", "label": "Nota a mano", "default": "en CapCut 😩"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "transparente"},
  {"id": "tinta", "type": "color", "label": "Color texto", "default": "#5A2630"},
  {"id": "acento", "type": "color", "label": "Color nota", "default": "#D9A0A0"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "elementos"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  :root { --papel: #F5E6DF; --tinta: #5A2630; --acento: #D9A0A0; }
  #cr04-g { position: absolute; left: 120px; top: 180px; display: flex; align-items: flex-end; gap: 26px; }
  #cr04-num { font: 900 380px/0.8 var(--sans); color: var(--tinta); letter-spacing: -14px; text-shadow: 0 8px 0 rgba(255,255,255,.6); }
  #cr04-pal { font: 900 120px/1 var(--sans); color: var(--tinta); letter-spacing: -3px; padding-bottom: 26px; text-shadow: 0 5px 0 rgba(255,255,255,.6); }
  #cr04-nota { position: absolute; left: 520px; top: 500px; font: 700 70px var(--mano); color: var(--tinta); background: var(--acento); padding: 4px 22px 8px; border-radius: 14px; transform: rotate(-5deg); white-space: nowrap; }
</style>
</head>
<body>
<div id="root" data-composition-id="cr04" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <div class="hoja"></div>
  <div class="capa">
    <div id="cr04-g"><div id="cr04-num" data-lu="numero"></div><div id="cr04-pal" data-lu="palabra"></div></div>
    <div id="cr04-nota" data-lu="nota"></div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#cr04-num', { scale: 0, rotate: -30, transformOrigin: '50% 90%' }, { scale: 1, rotate: 0, duration: .55, ease: 'back.out(2.4)' }, 0)
    .fromTo('#cr04-pal', { x: 80, opacity: 0 }, { x: 0, opacity: 1, duration: .4, ease: 'power3.out' }, .25)
    .fromTo('#cr04-nota', { scale: 0, rotate: 20 }, { scale: 1, rotate: -5, duration: .45, ease: 'back.out(2.6)' }, .7)
    .to('#cr04-num', { rotate: 4, duration: .9, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 1.0)
    .to('.capa', { opacity: 0, y: -30, duration: .25, ease: 'power2.in' }, 2.75);
  window.__timelines = window.__timelines || {};
  window.__timelines["cr04"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
