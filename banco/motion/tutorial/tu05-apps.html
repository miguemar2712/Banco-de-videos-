<!doctype html>
<html lang="es" data-zona="panel" data-composition-variables='[
  {"id": "app1", "type": "string", "label": "App 1", "default": "Claude Code"},
  {"id": "ico1", "type": "string", "label": "Ícono 1 (emoji)", "default": "🤖"},
  {"id": "uso1", "type": "string", "label": "Para qué 1", "default": "Edita"},
  {"id": "app2", "type": "string", "label": "App 2", "default": "HyperFrames"},
  {"id": "ico2", "type": "string", "label": "Ícono 2 (emoji)", "default": "🎬"},
  {"id": "uso2", "type": "string", "label": "Para qué 2", "default": "Anima"},
  {"id": "chip", "type": "string", "label": "Etiqueta final", "default": "Solo necesitas estas 2 herramientas"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "hoja"},
  {"id": "tinta", "type": "color", "label": "Color texto", "default": "#3A2A1F"},
  {"id": "acento", "type": "color", "label": "Color acento", "default": "#C9A15F"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "panel"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  #tu05-fila { position: absolute; left: 0; right: 0; top: 230px; display: flex; justify-content: center; align-items: center; gap: 60px; }
  .tu05-a { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .tu05-i { width: 230px; height: 230px; border-radius: 56px; display: flex; align-items: center; justify-content: center; font-size: 130px; }
  .tu05-n { font: 800 40px var(--sans); color: var(--tinta); }
  .tu05-u { font: 500 32px var(--body); color: var(--tinta2); }
  #tu05-mas { font: 900 110px var(--sans); color: var(--acento); }
  #tu05-chip { position: absolute; left: 0; right: 0; top: 720px; text-align: center; }
  #tu05-chip span { display: inline-flex; align-items: center; gap: 14px; font: 700 40px var(--sans); color: var(--tinta); background: #fff; border: 3px solid color-mix(in srgb, #2BB673 60%, transparent); padding: 12px 30px; border-radius: 999px; box-shadow: var(--sombra); }
</style>
</head>
<body>
<div id="root" data-composition-id="tu05" data-start="0" data-duration="3.5" data-width="1080" data-height="1920">
  <div class="hoja"></div>
  <div class="capa mitad">
    <div id="tu05-fila">
      <div class="tu05-a" id="tu05-a1"><div class="tu05-i tarjeta emoji" data-lu="ico1"></div><div class="tu05-n" data-lu="app1"></div><div class="tu05-u" data-lu="uso1"></div></div>
      <div id="tu05-mas">+</div>
      <div class="tu05-a" id="tu05-a2"><div class="tu05-i tarjeta emoji" data-lu="ico2"></div><div class="tu05-n" data-lu="app2"></div><div class="tu05-u" data-lu="uso2"></div></div>
    </div>
    <div id="tu05-chip"><span>✅ <b data-lu="chip"></b></span></div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#tu05-a1', { x: -300, opacity: 0, rotate: -10 }, { x: 0, opacity: 1, rotate: 0, duration: .55, ease: 'back.out(1.6)' }, 0)
    .fromTo('#tu05-mas', { scale: 0, rotate: -90 }, { scale: 1, rotate: 0, duration: .4, ease: 'back.out(3)' }, .35)
    .fromTo('#tu05-a2', { x: 300, opacity: 0, rotate: 10 }, { x: 0, opacity: 1, rotate: 0, duration: .55, ease: 'back.out(1.6)' }, .55)
    .fromTo('#tu05-chip span', { y: 40, opacity: 0, scale: .9 }, { y: 0, opacity: 1, scale: 1, duration: .45, ease: 'back.out(2)' }, 1.2)
    .to('.tu05-i', { y: -10, duration: .6, yoyo: true, repeat: 1, ease: 'sine.inOut', stagger: .15 }, 1.6)
    .to('.capa', { opacity: 0, duration: .25 }, 3.25);
  window.__timelines = window.__timelines || {};
  window.__timelines["tu05"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
