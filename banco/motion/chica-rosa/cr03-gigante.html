<!doctype html>
<html lang="es" data-zona="elementos" data-composition-variables='[
  {"id": "linea1", "type": "string", "label": "Línea 1", "default": "TEXTOS"},
  {"id": "linea2", "type": "string", "label": "Línea 2", "default": "GIGANTES"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "transparente"},
  {"id": "tinta", "type": "color", "label": "Color texto", "default": "#5A2630"},
  {"id": "acento", "type": "color", "label": "Color estrellas", "default": "#D9A0A0"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "elementos"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  :root { --papel: #F5E6DF; --tinta: #5A2630; --acento: #D9A0A0; }
  #cr03-g { position: absolute; left: 0; right: 0; top: 190px; text-align: center; }
  .cr03-l { display: block; font: 900 190px/0.95 var(--sans); letter-spacing: -6px; color: var(--tinta); white-space: nowrap; text-shadow: 0 6px 0 rgba(255,255,255,.65); }
  .cr03-e { position: absolute; width: 64px; height: 64px; }
</style>
</head>
<body>
<div id="root" data-composition-id="cr03" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <div class="hoja"></div>
  <div class="capa">
    <svg class="cr03-e" style="right:70px;top:150px" viewBox="0 0 100 100"><path d="M50 0 L57 43 L100 50 L57 57 L50 100 L43 57 L0 50 L43 43 Z" fill="var(--tinta)"/></svg>
    <svg class="cr03-e" style="left:90px;top:560px;width:48px;height:48px" viewBox="0 0 100 100"><path d="M50 4 L61 38 L97 38 L68 60 L79 95 L50 73 L21 95 L32 60 L3 38 L39 38 Z" fill="var(--acento)"/></svg>
    <svg class="cr03-e" style="right:150px;top:600px;width:40px;height:40px" viewBox="0 0 100 100"><path d="M50 4 L61 38 L97 38 L68 60 L79 95 L50 73 L21 95 L32 60 L3 38 L39 38 Z" fill="var(--acento)"/></svg>
    <div id="cr03-g"><span class="cr03-l" id="cr03-l1" data-lu="linea1"></span><span class="cr03-l" id="cr03-l2" data-lu="linea2"></span></div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  document.querySelectorAll('.cr03-l').forEach((el) => { const n = el.textContent.length; if (n > 8) el.style.fontSize = Math.max(90, 190 * 8 / n) + 'px'; });
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#cr03-l1', { x: -900 }, { x: 0, duration: .45, ease: 'expo.out' }, 0)
    .fromTo('#cr03-l2', { x: 900 }, { x: 0, duration: .45, ease: 'expo.out' }, .15)
    .fromTo('#cr03-g', { scale: 1 }, { scale: 1.06, duration: .12, yoyo: true, repeat: 1, ease: 'power2.out' }, .55)
    .fromTo('.cr03-e', { scale: 0, rotate: -120 }, { scale: 1, rotate: 0, duration: .45, ease: 'back.out(3)', stagger: .1 }, .4)
    .to('.cr03-e', { rotate: 30, duration: 1.6, ease: 'sine.inOut' }, .9)
    .to('#cr03-l1', { x: 900, duration: .3, ease: 'power3.in' }, 2.6)
    .to('#cr03-l2', { x: -900, duration: .3, ease: 'power3.in' }, 2.65)
    .to('.cr03-e', { scale: 0, duration: .2 }, 2.7);
  window.__timelines = window.__timelines || {};
  window.__timelines["cr03"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
