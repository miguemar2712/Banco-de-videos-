<!doctype html>
<html lang="es" data-zona="panel" data-composition-variables='[
  {"id": "app", "type": "string", "label": "Nombre de la app", "default": "Claude"},
  {"id": "icono", "type": "string", "label": "Ícono (emoji)", "default": "🎬"},
  {"id": "titulo", "type": "string", "label": "Texto arriba", "default": "Sube tu video desde el celular"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "hoja"},
  {"id": "tinta", "type": "color", "label": "Color texto", "default": "#3A2A1F"},
  {"id": "acento", "type": "color", "label": "Color botón", "default": "#C9A15F"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "panel"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  #tu04-titulo { position: absolute; left: 70px; top: 110px; }
  #tu04-tel { position: absolute; left: 390px; top: 230px; width: 300px; height: 620px; border-radius: 52px; background: #1A1410; padding: 14px; box-shadow: var(--sombra); }
  #tu04-pant { width: 100%; height: 100%; border-radius: 40px; background: #FFFDF8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; position: relative; overflow: hidden; }
  #tu04-isla { position: absolute; top: 14px; left: 50%; width: 90px; height: 26px; margin-left: -45px; border-radius: 14px; background: #1A1410; }
  #tu04-ico { width: 130px; height: 130px; border-radius: 32px; background: linear-gradient(135deg, var(--papel2), #fff); box-shadow: 0 10px 24px rgba(0,0,0,.15); display: flex; align-items: center; justify-content: center; font-size: 80px; position: relative; }
  #tu04-ok { position: absolute; right: -12px; top: -12px; width: 44px; height: 44px; border-radius: 50%; background: #2BB673; display: flex; align-items: center; justify-content: center; color: #fff; font: 800 26px var(--sans); }
  #tu04-app { font: 700 30px var(--sans); color: #3A2A1F; text-align: center; }
  #tu04-barra { width: 200px; height: 46px; border-radius: 23px; background: color-mix(in srgb, var(--tinta) 10%, transparent); overflow: hidden; position: relative; }
  #tu04-rel { position: absolute; inset: 0; background: var(--acento); transform-origin: left; }
  #tu04-btxt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 22px var(--sans); color: #3A2A1F; }
</style>
</head>
<body>
<div id="root" data-composition-id="tu04" data-start="0" data-duration="3.5" data-width="1080" data-height="1920">
  <div class="hoja"></div>
  <div class="capa mitad">
    <div id="tu04-titulo" class="tu-titulo" data-lu="titulo"></div>
    <div id="tu04-tel"><div id="tu04-pant"><div id="tu04-isla"></div>
      <div id="tu04-ico" class="emoji"><span data-lu="icono"></span><div id="tu04-ok">✓</div></div>
      <div id="tu04-app" data-lu="app"></div>
      <div id="tu04-barra"><div id="tu04-rel"></div><div id="tu04-btxt">Descargando…</div></div></div></div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#tu04-titulo', { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: .4, ease: 'power3.out' }, 0)
    .fromTo('#tu04-tel', { y: 500, rotate: 8 }, { y: 0, rotate: 0, duration: .7, ease: 'expo.out' }, .1)
    .fromTo('#tu04-ico', { scale: 0 }, { scale: 1, duration: .45, ease: 'back.out(2.4)' }, .55)
    .fromTo('#tu04-rel', { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: 'power1.inOut' }, .8)
    .set('#tu04-btxt', { textContent: 'Abrir' }, 1.95)
    .fromTo('#tu04-ok', { scale: 0 }, { scale: 1, duration: .35, ease: 'back.out(3)' }, 1.95)
    .to('#tu04-barra', { scale: 1.08, duration: .12, yoyo: true, repeat: 1 }, 2.4)
    .to('.capa', { opacity: 0, duration: .25 }, 3.25);
  window.__timelines = window.__timelines || {};
  window.__timelines["tu04"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
