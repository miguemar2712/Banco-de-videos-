<!doctype html>
<html lang="es" data-zona="elementos" data-composition-variables='[
  {"id": "app", "type": "string", "label": "Nombre de la ventana", "default": "Claude Code"},
  {"id": "lineas", "type": "string", "label": "Líneas (separadas por |)", "default": "> edita mi-video.mov|✓ silencios cortados|✓ subtítulos en mi estilo|✓ zooms y sonidos|✓ listo en out/mi-video.mp4"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "transparente"},
  {"id": "acento", "type": "color", "label": "Color acento", "default": "#C9A15F"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "elementos"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  .hoja { display: none; }
  #ci07-v { position: absolute; left: 70px; right: 70px; top: 170px; border-radius: 26px; overflow: hidden; background: #15110E; box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 1.5px rgba(241,217,166,.2); }
  #ci07-bar { height: 70px; display: flex; align-items: center; gap: 14px; padding: 0 26px; background: #221B16; border-bottom: 1px solid rgba(241,217,166,.12); }
  #ci07-bar i { width: 20px; height: 20px; border-radius: 50%; }
  #ci07-bar b { flex: 1; text-align: center; font: 600 28px 'Inter'; color: #CBB99F; margin-right: 80px; }
  #ci07-cuerpo { padding: 30px 34px 36px; font: 400 36px var(--mono); line-height: 1.7; color: #E9DCCB; min-height: 360px; }
  .ci07-l.ok { color: #F1D9A6; }
  #ci07-cur { display: inline-block; width: 18px; height: 38px; background: var(--acento); vertical-align: middle; }
</style>
</head>
<body>
<div id="root" data-composition-id="ci07" data-start="0" data-duration="4" data-width="1080" data-height="1920">
  <div class="cine"></div>
  <div class="capa">
    <div id="ci07-v">
      <div id="ci07-bar"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i><b data-lu="app"></b></div>
      <div id="ci07-cuerpo"></div>
    </div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  const cuerpo = document.querySelector('#ci07-cuerpo');
  const lineas = String(LU.vars.lineas).split('|').map((s) => s.trim()).filter(Boolean).slice(0, 6);
  const els = lineas.map((t) => { const d = document.createElement('div'); d.className = 'ci07-l' + (t.startsWith('✓') ? ' ok' : ''); d.dataset.t = t; cuerpo.appendChild(d); return d; });
  const cur = document.createElement('span'); cur.id = 'ci07-cur';
  const prog = { v: 0 }, total = lineas.join('').length;
  const pinta = () => {
    let quedan = Math.round(prog.v);
    els.forEach((e) => { const t = e.dataset.t; const n = Math.max(0, Math.min(t.length, quedan)); e.textContent = t.slice(0, n); quedan -= t.length; });
    const ult = els.find((e) => e.textContent.length < e.dataset.t.length) || els[els.length - 1];
    ult.appendChild(cur);
  };
  pinta();
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#ci07-v', { y: 80, opacity: 0, scale: .94, rotateX: 18 }, { y: 0, opacity: 1, scale: 1, rotateX: 0, duration: .6, ease: 'expo.out' }, 0)
    .fromTo(prog, { v: 0 }, { v: total, duration: 2.4, ease: 'none', onUpdate: pinta }, .45)
    .fromTo(cur, { opacity: 1 }, { opacity: 0, duration: .25, yoyo: true, repeat: 13, ease: 'steps(1)' }, .3)
    .to('#ci07-v', { opacity: 0, y: -30, duration: .35, ease: 'power2.in' }, 3.65);
  window.__timelines = window.__timelines || {};
  window.__timelines["ci07"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
