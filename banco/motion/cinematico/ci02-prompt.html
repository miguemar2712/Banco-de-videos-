<!doctype html>
<html lang="es" data-zona="elementos" data-composition-variables='[
  {"id": "titulo", "type": "string", "label": "Texto arriba", "default": "y en un solo prompt"},
  {"id": "prompt", "type": "string", "label": "Lo que se escribe", "default": "Edítame este video con mi estilo"},
  {"id": "fondo", "type": "string", "label": "Fondo (hoja | transparente)", "default": "transparente"},
  {"id": "acento", "type": "color", "label": "Color botón", "default": "#C9A15F"},
  {"id": "x", "type": "number", "label": "Mover a los lados (px)", "default": 0},
  {"id": "y", "type": "number", "label": "Subir (-) / bajar (+) en px", "default": 0},
  {"id": "escala", "type": "number", "label": "Tamaño (1 = normal)", "default": 1},
  {"id": "zona", "type": "string", "label": "Zona (elementos | titulo | pantalla | libre)", "default": "elementos"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../../assets/lu.css" />
<style>
  .hoja { display: none; }
  #ci02-titulo { position: absolute; left: 0; right: 0; top: 230px; text-align: center; font: 700 64px 'Inter', sans-serif; color: #F7F1E8; letter-spacing: -1.5px; text-shadow: 0 4px 24px rgba(0,0,0,.7); }
  #ci02-barra { position: absolute; left: 70px; right: 70px; top: 340px; height: 140px; padding: 0 22px 0 44px; display: flex; align-items: center; gap: 20px; border-radius: 70px; }
  #ci02-txt { flex: 1; font: 500 46px 'Inter', sans-serif; color: #F7F1E8; white-space: nowrap; overflow: hidden; }
  #ci02-cursor { display: inline-block; width: 3px; height: 50px; background: var(--acento); vertical-align: middle; margin-left: 3px; }
  #ci02-boton { width: 96px; height: 96px; border-radius: 50%; flex: none; background: linear-gradient(135deg, #F1D9A6, var(--acento)); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px color-mix(in srgb, var(--acento) 70%, transparent); }
  #ci02-halo { position: absolute; left: 70px; right: 70px; top: 340px; height: 140px; border-radius: 70px; box-shadow: 0 0 0 3px var(--acento), 0 0 60px color-mix(in srgb, var(--acento) 60%, transparent); opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="ci02" data-start="0" data-duration="3.5" data-width="1080" data-height="1920">
  <div class="cine"></div>
  <div class="capa">
    <div id="ci02-titulo" data-lu="titulo"></div>
    <div id="ci02-halo"></div>
    <div id="ci02-barra" class="vidrio"><div id="ci02-txt"><span id="ci02-t"></span><span id="ci02-cursor"></span></div>
      <div id="ci02-boton"><svg width="44" height="44" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="#1A1410" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
  </div>
</div>
<script src="../../assets/lu.js"></script>
<script>
  const prompt = String(LU.vars.prompt), t = document.querySelector('#ci02-t'), n = { v: 0 };
  const pinta = () => { t.textContent = prompt.slice(0, Math.round(n.v)); };
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#ci02-titulo', { y: 20, opacity: 0, filter: 'blur(8px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: .5, ease: 'power3.out' }, 0)
    .fromTo('#ci02-barra', { y: 60, opacity: 0, scale: .94 }, { y: 0, opacity: 1, scale: 1, duration: .6, ease: 'expo.out' }, .15)
    .fromTo(n, { v: 0 }, { v: prompt.length, duration: Math.min(1.6, prompt.length * .045), ease: 'none', onUpdate: pinta }, .6)
    .fromTo('#ci02-cursor', { opacity: 1 }, { opacity: 0, duration: .25, yoyo: true, repeat: 9, ease: 'steps(1)' }, .3)
    .to('#ci02-boton', { scale: .82, duration: .12, yoyo: true, repeat: 1, ease: 'power2.inOut' }, 2.35)
    .fromTo('#ci02-halo', { opacity: 0, scale: 1 }, { opacity: 1, scale: 1.03, duration: .3, ease: 'power2.out', immediateRender: false }, 2.4)
    .to('#ci02-halo', { opacity: 0, scale: 1.08, duration: .6 }, 2.7)
    .to('.capa', { opacity: 0, y: -30, duration: .35, ease: 'power2.in' }, 3.15);
  window.__timelines = window.__timelines || {};
  window.__timelines["ci02"] = tl;
  LU.ajustarZona();
</script>
</body>
</html>
